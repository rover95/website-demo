<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="炫酷的 Agent 驱动个人主页。" />
    <title>Rover95 · Agent Enhanced Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <main class="shell" id="pageRoot" data-stage="0">
      <section class="hero card">
        <p class="eyebrow">AI NATIVE FRONTEND ENGINEER</p>
        <h1 id="heroTitle">正在初始化个人宇宙...</h1>
        <p id="heroDesc">当前仅保留基础结构，等待 agent 自动扩建站点能力。</p>
        <div class="cta-row">
          <a class="btn primary" href="#projects">查看项目</a>
          <a class="btn ghost" href="#workflow">查看流程</a>
        </div>
        <div class="chip-list" id="tagList"></div>
      </section>

      <section class="metrics" id="metrics"></section>

      <section class="panel-grid">
        <article class="card" id="projects">
          <p class="eyebrow">PROJECTS</p>
          <h2>项目星图</h2>
          <div class="block-list" id="projectList"></div>
        </article>
        <article class="card" id="workflow">
          <p class="eyebrow">WORKFLOW</p>
          <h2>Agent 协作链路</h2>
          <div class="timeline" id="workflowList"></div>
        </article>
      </section>
    </main>

    <aside class="agent-window" aria-label="agent console">
      <div class="window-header">
        <strong>Agent Console</strong>
        <span class="dot"></span>
      </div>
      <div class="chat-log" id="chatLog"></div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
