<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个由对话驱动实时进化的个人主页。" />
    <title>Live Agent Portfolio Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page" id="pageRoot" data-stage="0">
      <section class="profile" id="profileCard">
        <p class="label">stage 0 · minimal</p>
        <h1 id="heroTitle">一个普通的个人主页</h1>
        <p id="heroDesc">内容很少，等待 agent 帮我逐步完善。</p>
        <div class="tags" id="tagList"></div>
      </section>

      <section class="chat-shell">
        <header>
          <h2>Agent 对话框（自动演示）</h2>
          <p>对话会驱动当前页面实时变化</p>
        </header>
        <div class="chat-log" id="chatLog" aria-live="polite"></div>
      </section>

      <section class="blocks" id="liveBlocks"></section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
